name: refresh profile art

on:
  schedule:
    - cron: '17 0 * * *'   # 每天 00:17 UTC 重画贡献图
  workflow_dispatch:       # 也可手动触发

permissions:
  contents: write          # auto-commit 需要写权限

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate profile SVGs from official GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_profile_art.py

      - name: Commit only if the SVGs changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: assets/*.svg
